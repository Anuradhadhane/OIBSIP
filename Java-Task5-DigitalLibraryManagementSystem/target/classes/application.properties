spring.application.name=digital-library-management-system
server.port=8080

# Configure these environment variables in your system, or replace the defaults locally.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/digital_library}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
